[project]
name = "janos"
version = "0.2.0"
description = "Chest X-ray classification research application with Flask and Keras"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "flask>=3.1.3",
    "bcrypt>=5.0.0",
    "flask-limiter[redis]>=4.1.1",
    "flask-login>=0.6.3",
    "flask-mail>=0.10.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
    "flask-migrate>=4.1.0",
    "email-validator>=2.3.0",
    "itsdangerous>=2.2.0",
    "pillow>=12.3.0",
    "sqlalchemy>=2.1.4",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "waitress>=3.0.2",
    "gunicorn>=26.2.0; sys_platform != 'win32'",
]

[project.optional-dependencies]
inference = ["tensorflow>=2.21.0", "keras>=3.15.1", "numpy>=2.5.4", "h5py>=3.14.0"]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "ruff>=0.17.0", "pip-audit>=2.10.1", "pyyaml"]

[tool.uv]
package = false
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["inference: loads the real model and requires the inference extra"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
