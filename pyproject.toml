[project]
name = "janos"
version = "0.1.0"
description = "Flask chest X-ray classification research application"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "flask>=3.1,<4",
    "flask-bcrypt>=1.0.1,<2",
    "flask-login>=0.6.3,<0.7",
    "flask-mail>=0.10,<0.11",
    "flask-sqlalchemy>=3.1,<4",
    "flask-wtf>=1.2,<2",
    "email-validator>=2.2,<3",
    "itsdangerous>=2.2,<3",
    "pillow>=10.4,<12",
]

[project.optional-dependencies]
inference = [
    "tensorflow==2.15.1; sys_platform != 'win32'",
    "tensorflow-intel==2.15.1; sys_platform == 'win32'",
    "numpy>=1.23.5,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.uv]
package = false
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
