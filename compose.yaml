name: janos
services:
  web:
    build: .
    init: true
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Run scripts/manage.py configure first}
      DATABASE_URL: postgresql+psycopg://janos:${POSTGRES_PASSWORD:?Run scripts/manage.py configure first}@db:5432/janos
      REDIS_URL: redis://redis:6379/0
      MAIL_SERVER: ${MAIL_SERVER:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-janos@localhost}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-false}
      MAIL_USE_SSL: ${MAIL_USE_SSL:-false}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-contact@localhost}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - uploads:/var/lib/janos
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: janos
      POSTGRES_USER: janos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/manage.py configure first}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U janos -d janos"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.6.6-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.4
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mail:/data
    ports:
      - "127.0.0.1:${MAIL_UI_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  database:
  uploads:
  redis:
  mail:
