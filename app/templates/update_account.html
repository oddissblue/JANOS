{% extends 'layout.html' %}
{% from '_forms.html' import field %}
{% block content %}
<section class="card narrow"><h1>Edit account details</h1><p>Update your username or email address.</p>
<form method="post">{{ form.hidden_tag() }}
{{ field(form.username, 'username') }}
{{ field(form.email, 'email') }}
{{ form.submit(class="button") }}
</form></section>
{% endblock %}
