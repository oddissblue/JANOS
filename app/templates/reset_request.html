{% extends 'layout.html' %}
{% from '_forms.html' import field %}
{% block content %}
<section class="card narrow"><h1>Reset your password</h1><p>Enter your account email. If it matches an account, you will receive a reset link.</p>
<form method="post">{{ form.hidden_tag() }}
{{ field(form.email, 'email') }}
{{ form.submit(class="button") }}
</form></section>
{% endblock %}
