{% extends "layout.html" %}
{% block content %}
<!--============================================ scanner section ===================================================-->
<section class="formpage_section">
    <div class="scanner_container">
        <div class="row justify-content-center">
            <h1 style="color: #00bfff;"> Pneumonia Detector </h1>
         </div>
        <div class="row justify-content-center mt-5">
            <img src="{{ url_for('uploaded_image', filename=name) }}" style="width: 400px;">
        </div>
        <div class="row justify-content-center mt-3">
            <div><h5> {{name}} </h5></div>
        </div>
        <div class="row justify-content-center mt-5">
            <div>
                <h4>
                    Scan Result: <span style="color: #00bfff;"> {{predection}} </span>
                    &nbsp;&nbsp;
                    Confidence: <span style="color: #00bfff;">{{probability}} % </span>
                </h4>
            </div>
        </div>
        <div class="row justify-content-center mt-4">
            <form action="{{ url_for('scanner')}}">
                <button type="submit" class="btn btn-primary-red">Confirm</button>
            </form>
        </div>
    </div>
</section>
{% endblock content %}
